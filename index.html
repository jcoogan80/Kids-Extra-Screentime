<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Screen Time Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-in; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen">
    <div id="app" class="p-4 md:p-6 max-w-7xl mx-auto"></div>

        const mathProblems = {
            elementary: [
                { type: 'addition', range: [1, 20], template: (a, b) => `${a} + ${b}`, answer: (a, b) => a + b },
                { type: 'subtraction', range: [1, 20], template: (a, b) => `${Math.max(a,b)} - ${Math.min(a,b)}`, answer: (a, b) => Math.max(a,b) - Math.min(a,b) },
                { type: 'multiplication', range: [1, 10], template: (a, b) => `${a} × ${b}`, answer: (a, b) => a * b }
            ],
            middle: [
                { type: 'multiplication', range: [6, 15], template: (a, b) => `${a} × ${b}`, answer: (a, b) => a * b },
                { type: 'division', range: [2, 12], template: (a, b) => `${a * b} ÷ ${b}`, answer: (a, b) => a },
                { type: 'fractions', range: [1, 10], template: (a, b) => `${a}/${b} + ${a}/${b}`, answer: (a, b) => (2*a)/b }
            ],
            high: [
                { type: 'algebra', range: [1, 20], template: (a, b) => `Solve: ${b}x + ${a} = ${a + b * 3}`, answer: () => 3 },
                { type: 'percentages', range: [10, 50], template: (a, b) => `What is ${a}% of ${b * 10}?`, answer: (a, b) => (a * b * 10) / 100 },
                { type: 'order', range: [1, 10], template: (a, b) => `${a} + ${b} × 2`, answer: (a, b) => a + (b * 2) }
            ]
        };

        const readingPassages = {
            elementary: [
                { 
                    text: "The little puppy named Max wagged his tail happily as he ran through the park. It was a beautiful sunny day, and Max loved to play fetch with his favorite red ball. Every morning, Max would wake up early and run to find his toy. His owner, Sarah, would throw the ball across the grassy field, and Max would chase after it as fast as his little legs could carry him. When Max caught the ball, he would bring it back to Sarah with his tail wagging proudly. Sometimes, other dogs would come to the park too, and Max would make new friends. But no matter how many friends he made, the red ball was always his favorite thing in the whole world. At the end of each day, Max would curl up in his cozy bed, dreaming about tomorrow's adventure in the park.",
                    questions: [
                        { q: "What was the puppy's name?", a: "Max", options: ["Max", "Buddy", "Rex"] },
                        { q: "What did Max like to play?", a: "fetch", options: ["fetch", "hide and seek", "tag"] },
                        { q: "What color was Max's favorite ball?", a: "red", options: ["red", "blue", "yellow"] },
                        { q: "Who was Max's owner?", a: "Sarah", options: ["Sarah", "Emily", "Jessica"] },
                        { q: "Where did Max play?", a: "park", options: ["park", "beach", "backyard"] }
                    ]
                },
                {
                    text: "Sarah loved gardening more than anything else. One spring morning, she decided to plant a vegetable garden in her backyard. She carefully dug small holes in the soft brown dirt and placed tiny seeds inside each one. Sarah planted tomato seeds, carrot seeds, and lettuce seeds in neat rows. Every single day, she would water her garden with a green watering can, making sure each plant got enough water to grow strong and healthy. She also pulled out any weeds that tried to steal nutrients from her vegetables. After two long weeks of waiting and caring for her garden, tiny green sprouts began to appear through the soil. Sarah was so excited that she called her mom to come see! As the weeks went by, the sprouts grew taller and taller. Soon, Sarah would have fresh vegetables to eat for dinner. She learned that with patience and hard work, wonderful things can grow.",
                    questions: [
                        { q: "What did Sarah plant?", a: "seeds", options: ["seeds", "flowers", "trees"] },
                        { q: "What color was the watering can?", a: "green", options: ["green", "red", "blue"] },
                        { q: "How long until sprouts appeared?", a: "two weeks", options: ["one week", "two weeks", "one month"] },
                        { q: "What vegetables did she plant?", a: "tomatoes, carrots, and lettuce", options: ["tomatoes, carrots, and lettuce", "beans and corn", "peppers and onions"] },
                        { q: "Who did Sarah call to see the sprouts?", a: "her mom", options: ["her mom", "her friend", "her teacher"] }
                    ]
                }
            ],
            middle: [
                {
                    text: "Photosynthesis is one of the most important processes on Earth and is essential for life as we know it. It is the process by which plants, algae, and some bacteria convert sunlight into chemical energy that can be used to fuel their activities. Plants use a special green pigment called chlorophyll in their leaves to capture light energy from the sun. This energy is then used to convert carbon dioxide from the air and water from the soil into glucose, a type of sugar that plants use for food and energy. As a byproduct of this amazing process, plants release oxygen into the atmosphere, which is the oxygen that humans and animals breathe to survive. Without photosynthesis, there would be no oxygen in our atmosphere, and life on Earth would not be possible. The process happens primarily in the leaves of plants, specifically in structures called chloroplasts. Interestingly, the reason most plants appear green to our eyes is because chlorophyll absorbs red and blue light wavelengths but reflects green light. Scientists estimate that photosynthesis produces about 330 billion tons of oxygen every year!",
                    questions: [
                        { q: "What do plants convert sunlight into?", a: "energy", options: ["energy", "water", "soil"] },
                        { q: "What chemical helps capture light?", a: "chlorophyll", options: ["oxygen", "chlorophyll", "carbon"] },
                        { q: "What gas do plants release?", a: "oxygen", options: ["oxygen", "carbon dioxide", "nitrogen"] },
                        { q: "Where does photosynthesis happen?", a: "leaves", options: ["leaves", "roots", "flowers"] },
                        { q: "Why do plants look green?", a: "chlorophyll reflects green light", options: ["chlorophyll reflects green light", "they absorb green light", "they contain green water"] }
                    ]
                },
                {
                    text: "The water cycle, also known as the hydrologic cycle, describes the continuous movement of water on, above, and below the surface of the Earth. This cycle is crucial for distributing water resources across our planet and maintaining life in all ecosystems. The process begins when the sun's heat causes water from oceans, lakes, and rivers to evaporate, turning liquid water into water vapor that rises into the atmosphere. As this warm, moist air rises higher into the sky, it cools down. When the water vapor cools enough, it condenses around tiny particles of dust in the air, forming billions of tiny water droplets. These droplets cluster together to create the clouds we see in the sky. Eventually, when the water droplets in clouds become too heavy, they fall back to Earth as precipitation in various forms such as rain, snow, sleet, or hail, depending on the temperature. Some of this precipitation soaks into the ground, replenishing underground water supplies called aquifers, while the rest flows across the land as runoff, eventually making its way back to rivers, lakes, and oceans. Then the cycle begins all over again. This endless cycle has been operating for billions of years and is responsible for providing fresh water to all living things on Earth.",
                    questions: [
                        { q: "What forms when water evaporates?", a: "clouds", options: ["clouds", "rain", "ice"] },
                        { q: "What is water returning to Earth called?", a: "precipitation", options: ["evaporation", "precipitation", "condensation"] },
                        { q: "What causes water to evaporate?", a: "sun's heat", options: ["sun's heat", "wind", "gravity"] },
                        { q: "What are underground water supplies called?", a: "aquifers", options: ["aquifers", "reservoirs", "springs"] },
                        { q: "What do water droplets form around?", a: "dust particles", options: ["dust particles", "ice crystals", "air bubbles"] }
                    ]
                }
            ],
            high: [
                {
                    text: "William Shakespeare's influence on the English language and literature is truly immeasurable and continues to resonate through modern culture centuries after his death. Born in 1564 in Stratford-upon-Avon, England, Shakespeare became one of the greatest playwrights and poets in history. He invented over 1,700 words that are still in common use today, including terms like 'assassination', 'lonely', 'eyeball', 'bedroom', 'uncomfortable', and countless others. Many phrases we use daily, such as 'break the ice', 'wild goose chase', and 'heart of gold', originated from his plays and sonnets. His works explored complex themes of human nature, including love, jealousy, ambition, betrayal, and redemption, with such depth and insight that they remain profoundly relevant to audiences today. Shakespeare wrote 37 plays and 154 sonnets during his lifetime, creating unforgettable characters like Hamlet, Macbeth, Romeo, Juliet, and Othello. His plays have been translated into every major language and are performed more often than those of any other playwright in history. Scholars continue to study and debate the meanings and interpretations of his works, finding new insights with each generation. His contribution to literature has shaped not just English, but world culture, influencing countless writers, artists, and thinkers who came after him.",
                    questions: [
                        { q: "How many words did Shakespeare invent?", a: "over 1700", options: ["over 1700", "about 500", "over 5000"] },
                        { q: "What did his plays explore?", a: "human nature", options: ["human nature", "politics", "science"] },
                        { q: "How many plays did he write?", a: "37", options: ["37", "50", "25"] },
                        { q: "Where was Shakespeare born?", a: "Stratford-upon-Avon", options: ["Stratford-upon-Avon", "London", "Cambridge"] },
                        { q: "How many sonnets did he write?", a: "154", options: ["154", "100", "200"] }
                    ]
                },
                {
                    text: "Climate change refers to long-term shifts in global temperatures and weather patterns that are transforming our planet at an unprecedented rate. While Earth's climate has naturally changed throughout its 4.5-billion-year history due to variations in solar radiation, volcanic eruptions, and other natural factors, current changes are occurring at a rate never before seen in human history. Scientific evidence overwhelmingly demonstrates that these rapid changes are largely due to human activities, particularly the burning of fossil fuels like coal, oil, and natural gas. When we burn these fuels for energy, transportation, and manufacturing, they release greenhouse gases such as carbon dioxide and methane into the atmosphere. These gases trap heat from the sun, creating a 'greenhouse effect' that warms the planet. Since the Industrial Revolution began in the late 1700s, atmospheric carbon dioxide levels have increased by more than 50%, and global average temperatures have risen by approximately 1.1 degrees Celsius. This may sound small, but even this seemingly minor increase has led to melting ice caps, rising sea levels, more frequent and severe weather events like hurricanes and droughts, and disruptions to ecosystems worldwide. Scientists warn that if we don't reduce greenhouse gas emissions soon, we could face catastrophic consequences including mass extinctions, food and water shortages, and the displacement of millions of people from coastal areas. However, there is hope: by transitioning to renewable energy sources like solar and wind power, improving energy efficiency, and protecting forests that absorb carbon dioxide, we can work together to slow and eventually reverse these dangerous trends.",
                    questions: [
                        { q: "What is causing current climate change rate?", a: "human activities", options: ["natural cycles", "human activities", "solar radiation"] },
                        { q: "What do human activities release?", a: "greenhouse gases", options: ["oxygen", "greenhouse gases", "water vapor"] },
                        { q: "By how much have CO2 levels increased?", a: "more than 50%", options: ["more than 50%", "about 25%", "nearly 100%"] },
                        { q: "What creates the greenhouse effect?", a: "gases trapping heat", options: ["gases trapping heat", "clouds blocking sun", "ice melting"] },
                        { q: "What are renewable energy sources mentioned?", a: "solar and wind", options: ["solar and wind", "coal and oil", "nuclear and gas"] }
                    ]
                }
            ]
        };

        const spellingWords = {
            elementary: ["cat", "dog", "tree", "house", "happy", "friend", "school", "play", "book", "water", "jump", "run", "blue", "green", "smile"],
            middle: ["curious", "enormous", "adventure", "mystery", "education", "technology", "beautiful", "excellent", "important", "necessary", "different", "favorite", "together", "surprise", "careful"],
            high: ["accommodation", "conscientious", "extraordinary", "entrepreneurial", "philanthropy", "sophisticated", "acknowledge", "privilege", "hierarchy", "independence", "necessary", "occasion", "recommend", "rhythm", "separate"]
        };

        let state = {
            view: 'parent',
            selectedKid: null,
            kids: [],
            completedTasks: [],
            sessions: [],
            settings: {
                bonusMinutesPerTask: 15
            },
            showModal: false,
            modalType: null,
            editingItem: null,
            activeTimers: {},
            currentActivity: null,
            activityProgress: null,
            isLoading: true
        };

        // Check if cloud storage is available (only in Claude.ai artifacts)
        const hasCloudStorage = typeof window.storage !== 'undefined';

        async function loadData() {
            try {
                if (hasCloudStorage) {
                    // Use cloud storage
                    const kidsData = await window.storage.get('screentime-kids', false);
                    const tasksData = await window.storage.get('screentime-tasks', false);
                    const sessionsData = await window.storage.get('screentime-sessions', false);
                    const settingsData = await window.storage.get('screentime-settings', false);
                    
                    if (kidsData) state.kids = JSON.parse(kidsData.value);
                    if (tasksData) state.completedTasks = JSON.parse(tasksData.value);
                    if (sessionsData) state.sessions = JSON.parse(sessionsData.value);
                    if (settingsData) state.settings = JSON.parse(settingsData.value);
                } else {
                    // Fallback to localStorage
                    const savedKids = localStorage.getItem('st-kids');
                    const savedTasks = localStorage.getItem('st-completed-tasks');
                    const savedSessions = localStorage.getItem('st-sessions');
                    const savedSettings = localStorage.getItem('st-settings');
                    
                    if (savedKids) state.kids = JSON.parse(savedKids);
                    if (savedTasks) state.completedTasks = JSON.parse(savedTasks);
                    if (savedSessions) state.sessions = JSON.parse(savedSessions);
                    if (savedSettings) state.settings = JSON.parse(savedSettings);
                }
                
                state.isLoading = false;
                render();
            } catch (e) {
                console.log('No saved data, starting fresh');
                state.isLoading = false;
                render();
            }
        }

        async function saveData() {
            try {
                if (hasCloudStorage) {
                    // Use cloud storage
                    await window.storage.set('screentime-kids', JSON.stringify(state.kids), false);
                    await window.storage.set('screentime-tasks', JSON.stringify(state.completedTasks), false);
                    await window.storage.set('screentime-sessions', JSON.stringify(state.sessions), false);
                    await window.storage.set('screentime-settings', JSON.stringify(state.settings), false);
                } else {
                    // Fallback to localStorage
                    localStorage.setItem('st-kids', JSON.stringify(state.kids));
                    localStorage.setItem('st-completed-tasks', JSON.stringify(state.completedTasks));
                    localStorage.setItem('st-sessions', JSON.stringify(state.sessions));
                    localStorage.setItem('st-settings', JSON.stringify(state.settings));
                }
            } catch (e) {
                console.error('Save failed:', e);
            }
        }

        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        function getGradeLevel(grade) {
            if (!grade) return 'elementary';
            const gradeNum = parseInt(grade);
            if (gradeNum <= 5) return 'elementary';
            if (gradeNum <= 8) return 'middle';
            return 'high';
        }

        function getKidStats(kidId) {
            const today = getTodayString();
            const kid = state.kids.find(k => k.id === kidId);
            if (!kid) return null;

            const todaySessions = state.sessions.filter(s => s.kidId === kidId && s.date === today);
            const usedMinutes = todaySessions.reduce((sum, s) => sum + s.minutes, 0);
            const todayTasks = state.completedTasks.filter(t => t.kidId === kidId && t.date === today);
            const bonusMinutes = todayTasks.length * state.settings.bonusMinutesPerTask;
            const totalMinutes = kid.dailyLimit + bonusMinutes;
            const remainingMinutes = Math.max(0, totalMinutes - usedMinutes);

            return {
                usedMinutes,
                bonusMinutes,
                totalMinutes,
                remainingMinutes,
                todayTasks: todayTasks.length,
                isActive: state.activeTimers[kidId] ? true : false
            };
        }

        function startTimer(kidId) {
            if (state.activeTimers[kidId]) return;
            
            state.activeTimers[kidId] = {
                startTime: Date.now(),
                interval: setInterval(() => render(), 1000)
            };
            render();
        }

        function stopTimer(kidId) {
            if (!state.activeTimers[kidId]) return;
            
            const elapsed = Math.floor((Date.now() - state.activeTimers[kidId].startTime) / 60000);
            clearInterval(state.activeTimers[kidId].interval);
            delete state.activeTimers[kidId];
            
            if (elapsed > 0) {
                state.sessions.push({
                    id: Date.now(),
                    kidId,
                    date: getTodayString(),
                    minutes: elapsed,
                    timestamp: new Date().toISOString()
                });
                saveData();
            }
            render();
        }

        function getActiveMinutes(kidId) {
            if (!state.activeTimers[kidId]) return 0;
            return Math.floor((Date.now() - state.activeTimers[kidId].startTime) / 60000);
        }

        function generateMathActivity(kid) {
            const level = getGradeLevel(kid.grade);
            const problems = mathProblems[level];
            
            const numProblems = 10;
            const questions = [];
            
            for (let i = 0; i < numProblems; i++) {
                const problemType = problems[Math.floor(Math.random() * problems.length)];
                const [min, max] = problemType.range;
                const a = Math.floor(Math.random() * (max - min + 1)) + min;
                const b = Math.floor(Math.random() * (max - min + 1)) + min;
                questions.push({
                    question: problemType.template(a, b),
                    answer: problemType.answer(a, b).toString(),
                    userAnswer: ''
                });
            }
            
            return {
                type: 'math',
                kidId: kid.id,
                title: 'Math Practice',
                description: `Solve ${numProblems} math problems`,
                questions,
                currentQuestion: 0,
                startTime: Date.now()
            };
        }

        function generateReadingActivity(kid) {
            const level = getGradeLevel(kid.grade);
            const passages = readingPassages[level];
            const passage = passages[Math.floor(Math.random() * passages.length)];
            
            return {
                type: 'reading',
                kidId: kid.id,
                title: 'Reading Comprehension',
                description: 'Read the passage and answer questions',
                passage: passage.text,
                questions: passage.questions.map(q => ({ ...q, userAnswer: '' })),
                currentQuestion: 0,
                startTime: Date.now()
            };
        }

        function generateSpellingActivity(kid) {
            const level = getGradeLevel(kid.grade);
            const wordList = spellingWords[level];
            const selectedWords = [];
            const usedIndices = new Set();
            
            while (selectedWords.length < 5) {
                const index = Math.floor(Math.random() * wordList.length);
                if (!usedIndices.has(index)) {
                    usedIndices.add(index);
                    selectedWords.push({
                        word: wordList[index],
                        shown: false,
                        userAnswer: ''
                    });
                }
            }
            
            return {
                type: 'spelling',
                kidId: kid.id,
                title: 'Spelling Practice',
                description: 'Study the word, then spell it correctly',
                words: selectedWords,
                currentWord: 0,
                phase: 'study',
                startTime: Date.now()
            };
        }

        function startActivity(kid, activityType) {
            if (activityType === 'math') {
                state.currentActivity = generateMathActivity(kid);
            } else if (activityType === 'reading') {
                state.currentActivity = generateReadingActivity(kid);
            } else if (activityType === 'spelling') {
                state.currentActivity = generateSpellingActivity(kid);
            }
            render();
        }

        function submitAnswer(answer) {
            const activity = state.currentActivity;
            
            if (activity.type === 'math') {
                activity.questions[activity.currentQuestion].userAnswer = answer;
                if (activity.currentQuestion < activity.questions.length - 1) {
                    activity.currentQuestion++;
                } else {
                    checkActivityCompletion();
                }
            } else if (activity.type === 'reading') {
                activity.questions[activity.currentQuestion].userAnswer = answer;
                if (activity.currentQuestion < activity.questions.length - 1) {
                    activity.currentQuestion++;
                } else {
                    checkActivityCompletion();
                }
            }
            render();
        }

        function nextSpellingPhase() {
            const activity = state.currentActivity;
            const word = activity.words[activity.currentWord];
            
            if (activity.phase === 'study') {
                word.shown = true;
                activity.phase = 'spell';
            } else {
                if (activity.currentWord < activity.words.length - 1) {
                    activity.currentWord++;
                    activity.phase = 'study';
                } else {
                    checkActivityCompletion();
                }
            }
            render();
        }

        function checkActivityCompletion() {
            const activity = state.currentActivity;
            let correct = 0;
            let total = 0;
            
            if (activity.type === 'math') {
                activity.questions.forEach(q => {
                    total++;
                    if (parseFloat(q.userAnswer) === parseFloat(q.answer)) {
                        correct++;
                    }
                });
            } else if (activity.type === 'reading') {
                activity.questions.forEach(q => {
                    total++;
                    if (q.userAnswer === q.a) {
                        correct++;
                    }
                });
            } else if (activity.type === 'spelling') {
                activity.words.forEach(w => {
                    total++;
                    if (w.userAnswer.toLowerCase() === w.word.toLowerCase()) {
                        correct++;
                    }
                });
            }
            
            const percentage = (correct / total) * 100;
            const passed = percentage >= 70;
            
            if (passed) {
                state.completedTasks.push({
                    id: Date.now(),
                    kidId: activity.kidId,
                    type: activity.type,
                    date: getTodayString(),
                    score: percentage,
                    timeSpent: Math.floor((Date.now() - activity.startTime) / 1000),
                    timestamp: new Date().toISOString()
                });
                saveData();
            }
            
            state.activityProgress = { correct, total, percentage, passed };
            render();
        }

        function closeActivity() {
            state.currentActivity = null;
            state.activityProgress = null;
            render();
        }

        function openModal(type, item = null) {
            state.modalType = type;
            if (type === 'addKid' || type === 'editKid') {
                state.editingItem = item ? {...item} : { name: '', grade: '', dailyLimit: 60 };
            } else {
                state.editingItem = item;
            }
            state.showModal = true;
            render();
        }

        function closeModal() {
            state.showModal = false;
            state.modalType = null;
            state.editingItem = null;
            render();
        }

        function saveKid() {
            const kid = state.editingItem;
            
            if (!kid || !kid.name || !kid.grade || !kid.dailyLimit) {
                alert('Please fill in all fields');
                return;
            }

            kid.dailyLimit = parseInt(kid.dailyLimit);

            if (kid.id) {
                const index = state.kids.findIndex(k => k.id === kid.id);
                state.kids[index] = kid;
            } else {
                kid.id = Date.now();
                kid.avatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${kid.name}`;
                state.kids.push(kid);

                                </button>
                                <button onclick="closeModal()" 
                                    class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition">
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (state.modalType === 'settings') {
                return `
                    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onclick="if(event.target === this) closeModal()">
                        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6" onclick="event.stopPropagation()">
                            <h2 class="text-2xl font-bold text-gray-800 mb-6">Settings</h2>
                            
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Bonus Minutes per Task</label>
                                    <input type="number" value="${state.settings.bonusMinutesPerTask}" min="5" max="60"
                                        onchange="state.settings.bonusMinutesPerTask = parseInt(this.value); saveData();"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                                    <p class="text-xs text-gray-500 mt-1">Earned when scoring 70% or higher</p>
                                </div>
                            </div>

                            <button onclick="closeModal()" 
                                class="w-full mt-6 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition font-semibold">
                                Done
                            </button>
                        </div>
                    </div>
                `;
            }

            return '';
        }

        function render() {
            if (state.isLoading) {
                document.getElementById('app').innerHTML = `
                    <div class="flex items-center justify-center min-h-screen">
                        <div class="text-center">
                            <div class="text-4xl mb-4">⏳</div>
                            <p class="text-gray-600">Loading your data...</p>
                        </div>
                    </div>
                `;
                return;
            }

            const app = document.getElementById('app');
            
            app.innerHTML = `
                ${state.currentActivity ? renderActivityScreen() : ''}
                
                <div class="fade-in">
                    ${state.view === 'parent' ? renderParentView() : renderKidView()}
                </div>

                ${renderModal()}

                ${hasCloudStorage ? `
                    <div class="mt-6 bg-green-50 border border-green-200 rounded-lg p-4">
                        <h3 class="font-semibold text-green-900 mb-2">☁️ Cloud Saved!</h3>
                        <p class="text-sm text-green-800">Your data is saved in the cloud. Access from any browser or device - your kids and settings will be there!</p>
                    </div>
                ` : `
                    <div class="mt-6 bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                        <h3 class="font-semibold text-yellow-900 mb-2">💾 Browser Storage</h3>
                        <p class="text-sm text-yellow-800">Data is saved in this browser only. For cloud sync, access through Claude.ai</p>
                    </div>
                `}

                <div class="mt-4 bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <h3 class="font-semibold text-blue-900 mb-2">📱 How to Use:</h3>
                    <ol class="text-sm text-blue-800 space-y-1 list-decimal list-inside">
                        <li><strong>Kids:</strong> Complete math, reading, or spelling activities to earn bonus screen time</li>
                        <li><strong>Parents:</strong> Start/stop timers when kids use devices</li>
                        <li><strong>Score 70% or higher</strong> on activities to earn ${state.settings.bonusMinutesPerTask} bonus minutes</li>
                        <li><strong>Activities adapt</strong> to each child's grade level automatically</li>
                    </ol>
                </div>
            `;
        }

        loadData();
    </script>
</body>
</html>
